server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/example;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # proxy a backend service (e.g. message relay)
    location /api/msg {
        proxy_pass http://127.0.0.1:3002/msg;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-IPRegion $http_cf_region;
    }

    # visitor notification beacon
    location /beacon {
        proxy_pass http://127.0.0.1:3003/visit;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-IPRegion $http_cf_region;
    }

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    server_tokens off;
}
